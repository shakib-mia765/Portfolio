name: faang-portfolio-platform
x-defaults: &defaults
  restart: unless-stopped
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
x-app: &app
  <<: *defaults
  networks: [ingress, persistence]
  environment: {NODE_ENV: production, LOG_LEVEL: "${LOG_LEVEL:-info}"}
x-health: &health
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 30s
networks:
  ingress: {name: faang_ingress, driver: bridge}
  persistence: {name: faang_persistence, driver: bridge, internal: true}
volumes:
  postgres_data:
  mysql_data:
  nginx_cache:
services:
  gateway:
    <<: *defaults
    image: nginx:1.27-alpine
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    volumes: ["./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro", "./infrastructure/nginx/certs:/etc/nginx/certs:ro", "nginx_cache:/var/cache/nginx"]
    tmpfs: [/var/run, /tmp]
    networks: [ingress]
    depends_on: {ecommerce: {condition: service_healthy}, portfolio: {condition: service_healthy}, dashboard: {condition: service_healthy}, chat: {condition: service_healthy}, ai_engine: {condition: service_healthy}}
    healthcheck: {test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"], interval: 15s, timeout: 5s, retries: 5}
    cpus: 0.50
    mem_limit: 512m
  ecommerce:
    <<: *app
    build: {context: ., dockerfile: apps/ecommerce/web/Dockerfile, target: production}
    environment: {NODE_ENV: production, PORT: 3000, DATABASE_URL: "postgresql://${POSTGRES_USER:-portfolio_app}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:-portfolio}?schema=public"}
    expose: ["3000"]
    depends_on: {postgres: {condition: service_healthy}}
    healthcheck: {<<: *health, test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]}
    cpus: 1.50
    mem_limit: 2g
  portfolio:
    <<: *app
    build: {context: ., dockerfile: apps/portfolio/Dockerfile, target: production}
    environment: {NODE_ENV: production, PORT: 3001}
    expose: ["3001"]
    healthcheck: {<<: *health, test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health || exit 1"]}
    cpus: 1.00
    mem_limit: 1g
  dashboard:
    <<: *app
    build: {context: ., dockerfile: apps/dashboard/Dockerfile, target: production}
    environment: {NODE_ENV: production, PORT: 3002}
    expose: ["3002"]
    healthcheck: {<<: *health, test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/api/health || exit 1"]}
    cpus: 1.00
    mem_limit: 1g
  chat:
    <<: *app
    build: {context: ., dockerfile: apps/chat-app/Dockerfile, target: production}
    environment: {NODE_ENV: production, PORT: 3003, DATABASE_URL: "postgresql://${POSTGRES_USER:-portfolio_app}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:-portfolio}?schema=chat"}
    expose: ["3003"]
    depends_on: {postgres: {condition: service_healthy}}
    healthcheck: {<<: *health, test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3003/health || exit 1"]}
    stop_grace_period: 30s
    cpus: 2.00
    mem_limit: 4g
  ai_engine:
    <<: *app
    build: {context: ., dockerfile: apps/ai-engine/Dockerfile, target: production}
    environment: {PYTHONUNBUFFERED: "1", PORT: 8000, DATABASE_URL: "postgresql://${POSTGRES_USER:-portfolio_app}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:-portfolio}"}
    expose: ["8000"]
    depends_on: {postgres: {condition: service_healthy}}
    healthcheck: {<<: *health, test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health || exit 1"], start_period: 45s}
    cpus: 3.00
    mem_limit: 8g
  postgres:
    <<: *defaults
    image: postgres:16-alpine
    environment: {POSTGRES_USER: "${POSTGRES_USER:-portfolio_app}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?required}", POSTGRES_DB: "${POSTGRES_DB:-portfolio}"}
    volumes: ["postgres_data:/var/lib/postgresql/data", "./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro"]
    networks: [persistence]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 10s, timeout: 5s, retries: 10, start_period: 20s}
    shm_size: 256m
    cpus: 1.50
    mem_limit: 2g
